<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width,initial-scale=1" /><title>稿迹 · 投稿状态同步</title><link rel="stylesheet" href="popup.css" /></head>
  <body>
    <main>
      <strong>稿迹 · 投稿状态同步</strong>
      <p id="status">正在检查最近同步记录…</p>
      <label for="site-url">稿迹网址</label>
      <input id="site-url" type="url" placeholder="https://你的网址/" />
      <div class="actions"><button id="save-site">保存网址</button><button id="open-site">打开稿迹</button></div>
      <small id="message">登录和密码始终留在 Elsevier 官方页面。</small>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
